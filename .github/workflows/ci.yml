name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 (plugin tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify MCP dependency
        run: |
          python -m pip show mcp
          python -c "from mcp.server.fastmcp import FastMCP; print('MCP import OK')"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check server tests

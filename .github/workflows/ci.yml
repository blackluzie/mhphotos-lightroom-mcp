name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Isolate bounded diagnostic runs from older unresponsive workflow jobs.
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify MCP dependency
        run: |
          python -m pip show mcp
          python -c "from mcp.server.fastmcp import FastMCP; print('MCP import OK')"
      - name: Tests
        run: python -u -m pytest -v --durations=10 -o faulthandler_timeout=120
      - name: Lint
        run: python -m ruff check server tests
      - name: Native isolated installation smoke test
        run: python tests/install_smoke.py

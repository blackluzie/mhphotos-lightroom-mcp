name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 (plugin tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify MCP dependency
        run: |
          python -m pip show mcp
          python -c "from mcp.server.fastmcp import FastMCP; print('MCP import OK')"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check server tests
      - name: Package smoke test (wheel installs, ships the plugin, CLI works)
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/clean/bin/mhphotos-lightroom-mcp" install-plugin "$RUNNER_TEMP/plugin-out"
          test -f "$RUNNER_TEMP/plugin-out/mhphotos.lrdevplugin/Info.lua"
          MHPHOTOS_CONFIG_DIR="$RUNNER_TEMP/cfg" "$RUNNER_TEMP/clean/bin/mhphotos-lightroom-mcp" doctor

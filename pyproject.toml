[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mhphotos-lightroom-mcp"
version = "0.1.0"
description = "Experimental MCP bridge for Lightroom workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.10,<2", "anyio>=4", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
mhphotos-lightroom-mcp = "mhphotos_lightroom_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["server/mhphotos_lightroom_mcp"]

# ship the Lua plugin inside the wheel so `install-plugin` works after `uvx`/pipx installs
[tool.hatch.build.targets.wheel.force-include]
"plugin/mhphotos.lrdevplugin" = "mhphotos_lightroom_mcp/plugin/mhphotos.lrdevplugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mhphotos-lightroom-mcp"
version = "0.1.0"
description = "Experimental MCP bridge for Lightroom workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==1.30.0", "httpx>=0.28,<1", "Pillow>=12,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "lupa>=2,<3"]

[project.scripts]
mhphotos-lightroom-install = "mhphotos_lightroom_mcp.installer:main"
mhphotos-lightroom-mcp = "mhphotos_lightroom_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["server/mhphotos_lightroom_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
